import org.gradle.internal.os.OperatingSystem

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'io.github.fvarrui:javapackager:1.7.6'
    }
}

plugins {
    id "application"
}

apply plugin: 'io.github.fvarrui.javapackager.plugin'

repositories {
    mavenCentral()
}

project.ext.lwjglVersion = "3.3.6"
project.ext.jomlVersion = "1.10.8"
project.ext.imguiVersion = "1.81.0"

switch (OperatingSystem.current()) {
	case OperatingSystem.LINUX:
		project.ext.lwjglNatives = "natives-linux"
		def osArch = System.getProperty("os.arch")
		if (osArch.startsWith("arm") || osArch.startsWith("aarch64")) {
			project.ext.lwjglNatives += osArch.contains("64") || osArch.startsWith("armv8") ? "-arm64" : "-arm32"
		} else if  (osArch.startsWith("ppc")) {
			project.ext.lwjglNatives += "-ppc64le"
		} else if  (osArch.startsWith("riscv")) {
			project.ext.lwjglNatives += "-riscv64"
		}
		break
	case OperatingSystem.MAC_OS:
		project.ext.lwjglNatives = System.getProperty("os.arch").startsWith("aarch64") ? "natives-macos-arm64" : "natives-macos"
		break
	case OperatingSystem.WINDOWS:
		def osArch = System.getProperty("os.arch")
		project.ext.lwjglNatives = osArch.contains("64")
			? "natives-windows${osArch.startsWith("aarch64") ? "-arm64" : ""}"
			: "natives-windows-x86"
		break
}

dependencies {
    // This dependency is used by the application.
    implementation libs.guava

    // JBox2D.
    implementation "org.jbox2d:jbox2d-library:2.2.1.1"

    // Gson.
    implementation "com.google.code.gson:gson:2.13.1"

    // ImGUI.
    implementation "io.github.spair:imgui-java-app:$imguiVersion"

	// LWJGL.
	implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

	implementation "org.lwjgl:lwjgl"
	implementation "org.lwjgl:lwjgl-glfw"
	implementation "org.lwjgl:lwjgl-nfd"
	implementation "org.lwjgl:lwjgl-openal"
	implementation "org.lwjgl:lwjgl-opengl"
	implementation "org.lwjgl:lwjgl-stb"
	implementation "org.lwjgl:lwjgl::$lwjglNatives"
	implementation "org.lwjgl:lwjgl-glfw::$lwjglNatives"
	implementation "org.lwjgl:lwjgl-nfd::$lwjglNatives"
	implementation "org.lwjgl:lwjgl-openal::$lwjglNatives"
	implementation "org.lwjgl:lwjgl-opengl::$lwjglNatives"
	implementation "org.lwjgl:lwjgl-stb::$lwjglNatives"
	implementation "org.joml:joml:${jomlVersion}"
}

task setupFatJar(type: Copy) {
    copy {
        from "assets"
        into "${buildDir}/libs/assets"
    }

    copy {
        from "scenes"
        into "${buildDir}/libs/scenes"
    }

    copy {
        from "imgui.ini"
        into "${buildDir}/libs"
    }

    mkdir "${buildDir}/libs/logs"
}

jar {
    manifest {
        attributes(
            'Main-Class': "Bala"
        )
    }
}

task fatJar(type: Jar) {
    dependsOn setupFatJar

    manifest.from jar.manifest

    archiveBaseName = "bala"

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it).matching{exclude{it.path.contains("META-INF")}} }
    } 

    with jar
}

tasks.withType(Jar) {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

javapackager {
    name = 'bala'
    version = '1.0'
	mainClass = 'Bala'
    bundleJre = true
    customizedJre = false
    runnableJar = file('./build/libs/bala.jar')
    copyDependencies = false
    additionalResources = [file('./build/libs/assets'), file('./build/libs/scenes'), file('./build/libs/logs'), file('./build/libs/imgui.ini')]
}

task packageAppForWindows(type: io.github.fvarrui.javapackager.gradle.PackageTask, dependsOn: fatJar) {
	platform = 'windows'
	createZipball = true
}

task packageAppForLinux(type: io.github.fvarrui.javapackager.gradle.PackageTask, dependsOn: fatJar) {
	platform = 'linux'
	createTarball = true
}

task packageAppForMac(type: io.github.fvarrui.javapackager.gradle.PackageTask, dependsOn: fatJar) {
    platform = 'mac'
    createTarball = true
}

task packageApp(dependsOn: ['packageAppForWindows', 'packageAppForLinux', 'packageAppForMac']) {
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

application {
    mainClass = "Bala"
}

